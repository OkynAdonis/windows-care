name: Deploy TECH EXCHANGE site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test and build release
        shell: powershell
        run: ./build-release.ps1
      - name: Upload validated site
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
