<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Windows Care browser checks</title>
<body><pre id="result">RUNNING</pre>
<script id="fixtures" type="application/json">__FIXTURES__</script>
<script>
(async () => {
  const fixtures = JSON.parse(document.querySelector('#fixtures').textContent);
  let passed = 0;
  const assert = (value, message) => { if (!value) throw new Error(message); passed += 1; };
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  let frame;
  const load = async (page, width = 1280, options = {}) => {
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.style.cssText = `width:${width}px;height:800px;border:0;display:block`;
    let html = fixtures[page];
    if (options.noJS) html = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '');
    const setup = `<script>
      window.__errors = [];
      window.addEventListener('error', e => window.__errors.push(e.message));
      ${options.noObserver ? 'window.IntersectionObserver = undefined;' : ''}
      ${options.motion ? `window.__motion = {matches:false,addEventListener(type,fn){this.listener=fn;}};window.matchMedia=()=>window.__motion;` : ''}
    <\/script>`;
    html = html.replace('<head>', '<head>' + setup);
    frame.srcdoc = html;
    const ready = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
    document.body.append(frame);
    await ready;
    await wait(250);
    return { win: frame.contentWindow, doc: frame.contentDocument };
  };
  try {
    let { win, doc } = await load('guide', 360);
    assert(doc.querySelector('link[rel="icon"][data-product-icon="windows-care"]'), 'Guide Windows Care tab icon missing');
    const input = doc.querySelector('#action-search');
    const search = (text) => {
      input.value = text;
      input.dispatchEvent(new win.Event('input', { bubbles: true }));
    };
    search('reseau');
    const unaccented = Array.from(doc.querySelectorAll('.action-card')).filter(c => !c.hidden).length;
    search('réseau');
    assert(unaccented > 0 && unaccented === Array.from(doc.querySelectorAll('.action-card')).filter(c => !c.hidden).length, 'Accent-insensitive search failed');
    search('zzzz-no-match');
    assert(doc.querySelector('#action-search-status').textContent.includes('Aucune'), 'Empty search feedback missing');
    assert(Array.from(doc.querySelectorAll('.action-card')).every(c => win.getComputedStyle(c).display === 'none'), 'Filtered cards remain displayed');
    search('');
    assert(Array.from(doc.querySelectorAll('.action-card')).filter(c => !c.hidden).length === 36, 'Search reset did not restore 36 cards');
    search('confidentialite');
    win.dispatchEvent(new win.PageTransitionEvent('pageshow', { persisted: true }));
    assert(doc.querySelector('#action-search-status').textContent.includes('sur 36'), 'Restored search state missing');
    assert(win.__errors.length === 0, win.__errors.join(';'));

    ({ win, doc } = await load('index'));
    assert(doc.querySelector('link[rel="icon"][data-product-icon="windows-care"]'), 'Windows Care tab icon missing');
    const button = doc.querySelector('[data-download]');
    const label = button.textContent;
    // Empêcher uniquement l'effet natif du téléchargement après son gestionnaire.
    button.addEventListener('click', e => e.preventDefault());
    button.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(100);
    assert(button.classList.contains('download-started') && win.getComputedStyle(button, '::after').content !== 'none', 'Download loader missing');
    button.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(1900);
    assert(button.textContent === label && !button.classList.contains('download-started'), 'Repeated downloads did not reset');
    button.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, button: 0, ctrlKey: true }));
    assert(button.textContent === label, 'Modified click changed label');
    button.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    win.dispatchEvent(new win.PageTransitionEvent('pageshow', { persisted: true }));
    assert(button.textContent === label, 'Back navigation kept download state');
    const link = doc.querySelector('a[href="guide.html"]');
    let intercepted;
    link.addEventListener('click', e => { intercepted = e.defaultPrevented; e.preventDefault(); });
    link.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    assert(intercepted === false && !doc.body.classList.contains('page-leaving'), 'Native navigation intercepted');

    ({ win, doc } = await load('guide', 360, { noJS: true }));
    assert(Array.from(doc.querySelectorAll('.reveal')).every(c => win.getComputedStyle(c).opacity === '1'), 'Content hidden without JavaScript');
    ({ win, doc } = await load('index', 360, { noJS: true }));
    assert(doc.querySelector('[data-score]').textContent === '86', 'No-JS demo score incorrect');
    ({ win, doc } = await load('guide', 360, { noObserver: true }));
    assert(Array.from(doc.querySelectorAll('.reveal')).every(c => win.getComputedStyle(c).opacity === '1'), 'Missing observer hides content');
    ({ win, doc } = await load('guide', 360, { motion: true }));
    win.__motion.matches = true;
    win.__motion.listener();
    assert(!doc.documentElement.classList.contains('js-motion'), 'Motion preference change ignored');
    assert(Array.from(doc.querySelectorAll('.reveal')).every(c => win.getComputedStyle(c).opacity === '1'), 'Reduced motion content hidden');

    ({ win, doc } = await load('index', 360));
    const focusTarget = doc.querySelector('.details a') || doc.querySelector('.details');
    focusTarget.tabIndex = 0;
    focusTarget.focus();
    assert(doc.activeElement === focusTarget && focusTarget.closest('.reveal').classList.contains('is-visible'), 'Focus did not reveal hidden section');
    const downloadLink = doc.querySelector('[data-download]');
    downloadLink.focus();
    assert(doc.activeElement === downloadLink && downloadLink.getAttribute('href') === 'SCRIPT_TOOL.zip', 'Download not focusable');
    ({ win, doc } = await load('guide', 320));
    const searchInput = doc.querySelector('#action-search');
    searchInput.focus();
    assert(doc.activeElement === searchInput && doc.querySelector('label[for="action-search"]'), 'Search has no accessible focus or label');
    const liveStatus = doc.querySelector('#action-search-status');
    assert(liveStatus.getAttribute('aria-live') === 'polite' && searchInput.getAttribute('aria-describedby') === liveStatus.id, 'Search results are not associated with input');

    for (const page of ['index', 'guide']) {
      for (const width of [320, 360, 768, 1280]) {
        ({ win, doc } = await load(page, width));
        const qr = doc.querySelector('.footer-qr img');
        const qrLink = qr && qr.closest('a');
        assert(qr && qr.complete && qr.naturalWidth === 1000, `${page} QR image missing`);
        assert(qrLink && qrLink.href === 'https://okynadonis.github.io/windows-care/', `${page} QR destination differs`);
        assert(doc.documentElement.scrollWidth <= width + 1, `${page} overflows at ${width}px: ${doc.documentElement.scrollWidth}px`);
        assert(win.__errors.length === 0, `${page} JS error: ${win.__errors.join(';')}`);
      }
    }
    document.querySelector('#result').textContent = `PASS ${passed} browser assertions`;
  } catch (error) {
    document.querySelector('#result').textContent = 'FAIL ' + error.message;
  } finally {
    if (frame) frame.remove();
  }
})();
</script></body></html>
